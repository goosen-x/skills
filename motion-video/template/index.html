<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/devices.css/dist/devices.min.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/cyrillic-500.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/latin-500.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/cyrillic-700.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/latin-700.css">
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.abs{position:absolute}
.grid{position:absolute;inset:0;background:linear-gradient(to right,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/240px 100%,linear-gradient(to bottom,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/100% 135px}
.cm{position:absolute;width:8px;height:8px;background:#e9e9e9}
.card{position:absolute;border-radius:14px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.35)}
.bar{height:44px;display:flex;align-items:center;gap:8px;padding:0 18px;box-sizing:border-box}
.bar i{width:11px;height:11px;border-radius:50%;background:currentColor;opacity:.3}
.bar span{margin-left:14px;font:500 15px Inter;opacity:.65;padding:5px 16px;border-radius:8px;background:rgba(127,127,127,.16)}
.ln{white-space:nowrap;line-height:1.12}
.ln>span{display:inline-block;overflow:hidden;vertical-align:top}
.ln>span>span{display:inline-block}
</style>
<div id="stage"></div>
<!-- snapshots from snapshot.mjs go here: <script src="assets/snap/cart.js"></script> -->
<script src="engine.js"></script>
<script>
// music grid from beats.json: set BEAT and the first strong downbeat, cut scenes on bars
const BEAT = 60 / 120, BAR = 4 * BEAT, DROP = 2.0;
window.AUDIO_URL = null; // e.g. 'assets/audio/track.wav'

// 0 · title: frame opens, letters rise, then everything is pulled into the centre
{
  const s = scene(0, DROP);
  const fr = cropFrame(s.root);
  const word = letters(s.root, 'Название', { left: 0, right: 0, top: '470px', textAlign: 'center', color: '#fff', font: '700 140px Inter', letterSpacing: '-.02em' });
  s.update = (u) => {
    const out = eio((u - (s.dur - .4)) / .4);
    fr.set(960, 540, 1240 * sp(u, -.12, 140, 22) * (1 - out), lerp(6, 520, sp(u, 0, 140, 22)) * (1 - out));
    word.inner.forEach((e, i) => { e.style.transform = `translateY(${(1 - sp(u, .3 + i * .03, 200, 24)) * 110}%)`; });
    word.line.style.opacity = 1 - out;
  };
}

// 1 · a site in a browser window: rises in, then scrolls
{
  const s = scene(DROP, DROP + 2 * BAR);
  const b = browserCard(s.root, 'assets/img/example.jpg', 'example.com', 1400);
  Object.assign(b.c.style, { left: '260px', top: '90px' });
  b.vp.style.height = '860px';
  s.update = (u) => {
    const e = sp(u, -.1, 90, 18);
    b.c.style.transform = `perspective(2200px) translateY(${(1 - e) * 700}px) rotateX(${20 * (1 - e)}deg)`;
    b.im.style.transform = `translateY(${-1200 * eio(u / s.dur)}px)`;
  };
}

start(DROP + 2 * BAR);
</script>
<script src="player.js"></script>
